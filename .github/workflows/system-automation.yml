name: System Automation

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  linux-automation:
    name: Linux Automation
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Make scripts executable
      run: |
        chmod +x scripts/linux-automation.sh
        chmod +x scripts/linux-permissions.sh
        
    - name: Run Linux automation script
      env:
        SECRET_MESSAGE: ${{ secrets.SECRET_MESSAGE || 'default-secret' }}
        NODE_ENV: test
      run: ./scripts/linux-automation.sh
        
    - name: Upload Linux artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: linux-output
        path: |
          output/
          logs/
        retention-days: 7

  windows-automation:
    name: Windows Automation
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Run Windows automation script
      env:
        SECRET_MESSAGE: ${{ secrets.SECRET_MESSAGE || 'default-secret' }}
        NODE_ENV: test
      run: |
        powershell -ExecutionPolicy Bypass -File scripts\windows-automation.ps1
        
    - name: Upload Windows artifacts
      uses: actions/upload-artifact@v4
      with:
        name: windows-output
        path: |
          output\
          logs\
        retention-days: 7